          description: ds:DigestValue de la firma XMLDSig (base64).
        cdr:
          anyOf:
          - $ref: '#/components/schemas/CdrSalida'
          - type: 'null'
        intentos_envio:
          type: integer
          title: Intentos Envio
        enlaces:
          $ref: '#/components/schemas/EnlacesComprobante'
      type: object
      required:
      - tipo_comprobante
      - serie
      - correlativo
      - serie_numero
      - fecha_emision
      - hora_emision
      - moneda
      - tipo_cambio
      - emisor
      - cliente
      - lineas
      - totales
      - monto_en_letras
      - forma_pago
      - documentos_legado
      - referencia
      - motivo
      - sustento
      - estado
      - hash_cpe
      - cdr
      - intentos_envio
      - enlaces
      title: ComprobanteSalida
    ConciliacionSalida:
