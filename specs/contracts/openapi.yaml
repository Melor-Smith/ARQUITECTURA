      properties:
        serie:
          type: string
          pattern: ^[FB][A-Z0-9]{3}$
          title: Serie
          description: Serie de 4 caracteres. El correlativo lo asigna el servidor.
          examples:
          - F001
        fecha_emision:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Fecha Emision
