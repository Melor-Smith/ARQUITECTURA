components:
  schemas:
    AfectacionIGV:
      type: string
      enum:
      - '10'
      - '20'
      - '30'
      - '40'
      title: AfectacionIGV
      description: Catálogo 07. Se serializa en ``cac:TaxCategory/cbc:TaxExemptionReasonCode``.
    BoletaEntrada:
      properties:
        serie:
          type: string
          pattern: ^[FB][A-Z0-9]{3}$
          title: Serie
          description: Serie de 4 caracteres. El correlativo lo asigna el servidor.
          examples:
          - F001
        fecha_emision:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Fecha Emision
          description: Por defecto, la fecha actual del servidor (UTC-5).
        moneda:
          $ref: '#/components/schemas/Moneda'
          description: Catálogo 02.
          default: PEN
        tipo_cambio:
          anyOf:
          - type: number
            exclusiveMinimum: 0.0
          - type: string
          - type: 'null'
          title: Tipo Cambio
          description: Obligatorio si la moneda es USD.
        cliente:
          $ref: '#/components/schemas/ClienteEntrada'
        lineas:
          items:
            $ref: '#/components/schemas/LineaEntrada'
          type: array
          maxItems: 500
          minItems: 1
          title: Lineas
        tipo_comprobante:
          type: string
          const: '03'
          title: Tipo Comprobante
          description: 'Catálogo 01: boleta de venta.'
        documentos_legado:
          items:
            type: string
            maxLength: 40
            minLength: 1
          type: array
          maxItems: 50
          title: Documentos Legado
      additionalProperties: false
      type: object
      required:
      - serie
      - cliente
      - lineas
      - tipo_comprobante
      title: BoletaEntrada
    CdrSalida:
      properties:
        codigo:
          type: string
          title: Codigo
        descripcion:
          type: string
          title: Descripcion
        observaciones:
          items:
            type: string
          type: array
          title: Observaciones
        fecha_recepcion:
          type: string
          format: date-time
          title: Fecha Recepcion
      type: object
      required:
      - codigo
      - descripcion
      - observaciones
      - fecha_recepcion
      title: CdrSalida
    ClienteEntrada:
      properties:
        tipo_documento:
          $ref: '#/components/schemas/TipoDocumentoIdentidad'
          description: Catálogo 06.
        numero_documento:
          type: string
          maxLength: 15
          minLength: 1
          title: Numero Documento
          examples:
          - '20123456786'
        nombre:
          type: string
          maxLength: 500
          minLength: 1
          title: Nombre
          examples:
          - DISTRIBUIDORA EL SOL S.A.C.
        direccion:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Direccion
      additionalProperties: false
      type: object
      required:
      - tipo_documento
      - numero_documento
      - nombre
      title: ClienteEntrada
    CodigoDescripcion:
      properties:
        codigo:
          type: string
          title: Codigo
        descripcion:
          type: string
          title: Descripcion
      type: object
      required:
      - codigo
      - descripcion
      title: CodigoDescripcion
    ComprobanteSalida:
      properties:
        tipo_comprobante:
          $ref: '#/components/schemas/CodigoDescripcion'
        serie:
          type: string
          title: Serie
        correlativo:
          type: integer
          title: Correlativo
        serie_numero:
          type: string
          title: Serie Numero
          description: cbc:ID. Serie y correlativo solo se unen al serializar.
        fecha_emision:
          type: string
          format: date
          title: Fecha Emision
        hora_emision:
          type: string
          format: time
          title: Hora Emision
        moneda:
          type: string
          title: Moneda
        tipo_cambio:
          anyOf:
          - type: string
          - type: 'null'
          title: Tipo Cambio
        emisor:
          $ref: '#/components/schemas/ParteSalida'
        cliente:
          $ref: '#/components/schemas/ParteSalida'
        lineas:
          items:
            $ref: '#/components/schemas/LineaSalida'
          type: array
          title: Lineas
        totales:
          $ref: '#/components/schemas/TotalesSalida'
        monto_en_letras:
          type: string
          title: Monto En Letras
          description: Leyenda 1000 (Catálogo 52).
        forma_pago:
          anyOf:
          - $ref: '#/components/schemas/FormaPagoSalida'
          - type: 'null'
          description: Solo en facturas (RS 193-2020).
        documentos_legado:
          items:
            type: string
          type: array
          title: Documentos Legado
        referencia:
          anyOf:
          - $ref: '#/components/schemas/ReferenciaSalida'
          - type: 'null'
        motivo:
          anyOf:
          - $ref: '#/components/schemas/CodigoDescripcion'
          - type: 'null'
        sustento:
          anyOf:
          - type: string
          - type: 'null'
          title: Sustento
        estado:
          $ref: '#/components/schemas/EstadoComprobante'
