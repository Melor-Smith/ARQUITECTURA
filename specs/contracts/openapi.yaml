# GENERADO desde el código con scripts/exportar_openapi.py. No editar a mano.
openapi: 3.1.0
info:
  title: ABC Software Corp - Facturación electrónica UBL 2.1 e inventario
  description: "\nAPI de facturación electrónica UBL 2.1 (SUNAT) e inventario de **ABC Software Corp**.\n\n* Comprobantes:\
    \ factura (01), boleta (03), nota de crédito (07) y nota de débito (08).\n* El servidor calcula IGV, ISC (Catálogo 08)\
    \ e ICBPER y asigna el correlativo; el cliente no envía montos de\n  impuestos.\n* XML generado desde clases del XSD OASIS\
    \ UBL 2.1, validado y firmado con XMLDSig.\n* Migración de fichas del sistema antiguo al inventario permanente y libros\
    \ electrónicos PLE 14.1 y 12.1.\n* Errores en `application/problem+json` (RFC 9457): 400 contrato, 422 regla de negocio,\
    \ 409 conflicto.\n\nEste documento se genera desde el código; `specs/contracts/openapi.yaml` es su copia versionada y\
    \ una prueba\nfalla si ambos divergen.\n"
  version: 2.0.0
paths:
  /api/v1/comprobantes:
    post:
      tags:
      - Comprobantes
      summary: Emite una factura, boleta, nota de crédito o nota de débito
      description: 'Valida las reglas SUNAT, calcula IGV, ISC (Catálogo 08) e ICBPER con Decimal, asigna el correlativo de
        forma atómica, genera el XML UBL 2.1 desde clases del XSD, lo valida, lo firma (XMLDSig) y lo envía a la OSE. El cliente
        NO envía impuestos, totales ni correlativo.


        * **201**: la OSE devolvió CDR; el estado (`ACEPTADO`, `ACEPTADO_CON_OBSERVACIONES` o `RECHAZADO`) sale de ese CDR.

        * **202**: comprobante firmado y registrado, pero la OSE no respondió (`PENDIENTE_ENVIO`). Reintente con `POST .../envios`.

        * **200**: repetición idempotente (misma `Idempotency-Key` y mismo contenido).'
      operationId: emitir_comprobante_api_v1_comprobantes_post
      security:
      - HTTPBearer: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 8
            maxLength: 100
          - type: 'null'
          description: Evita duplicados si el cliente reintenta.
          title: Idempotency-Key
        description: Evita duplicados si el cliente reintenta.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/FacturaEntrada'
              - $ref: '#/components/schemas/BoletaEntrada'
              - $ref: '#/components/schemas/NotaCreditoEntrada'
              - $ref: '#/components/schemas/NotaDebitoEntrada'
              discriminator:
                propertyName: tipo_comprobante
                mapping:
                  '01': '#/components/schemas/FacturaEntrada'
                  '03': '#/components/schemas/BoletaEntrada'
                  '07': '#/components/schemas/NotaCreditoEntrada'
                  08: '#/components/schemas/NotaDebitoEntrada'
              title: Cuerpo
            examples:
              factura:
                summary: Factura
                value:
                  tipo_comprobante: '01'
                  serie: F001
                  moneda: PEN
                  cliente:
                    tipo_documento: '6'
                    numero_documento: '20123456786'
                    nombre: DISTRIBUIDORA DE ABARROTES EL SOL S.A.C.
                    direccion: JR. COMERCIO 123, LIMA
                  lineas:
                  - codigo_producto: AB-ARR-001
                    descripcion: Arroz extra a granel
                    unidad_medida: KGM
                    cantidad: '50'
                    valor_unitario: '4.20'
                    afectacion_igv: '10'
                  - codigo_producto: AB-AZU-001
                    descripcion: Azúcar rubia a granel
                    unidad_medida: KGM
                    cantidad: '25'
                    valor_unitario: '3.80'
                    afectacion_igv: '10'
              factura_con_isc_e_icbper:
                summary: Factura con isc e icbper
                value:
                  tipo_comprobante: '01'
                  serie: FA01
                  cliente:
                    tipo_documento: '6'
                    numero_documento: '20601234565'
                    nombre: BODEGA SAN MARTÍN & HIJOS E.I.R.L.
                  lineas:
                  - codigo_producto: BB-PIS-001
                    descripcion: Pisco quebranta 750 ml
                    unidad_medida: NIU
                    cantidad: '6'
                    valor_unitario: '45.00'
                    isc:
                      sistema: '01'
                      tasa: '0.20'
                  - codigo_producto: BB-CER-001
                    descripcion: Cerveza botella 620 ml
                    unidad_medida: NIU
                    cantidad: '12'
                    valor_unitario: '5.50'
                    isc:
                      sistema: '02'
                      monto_fijo: '1.35'
                  - codigo_producto: BB-GAS-001
                    descripcion: Gaseosa 3 L
                    unidad_medida: NIU
                    cantidad: '4'
                    valor_unitario: '9.00'
                    isc:
                      sistema: '03'
                      tasa: '0.17'
                      precio_venta_publico: '12.50'
                  - codigo_producto: EM-BOL-001
                    descripcion: Bolsa plástica con asa
                    unidad_medida: NIU
                    cantidad: '3'
                    valor_unitario: '0.10'
                    aplica_icbper: true
              factura_al_credito:
                summary: Factura al credito
                value:
                  tipo_comprobante: '01'
                  serie: F001
                  cliente:
                    tipo_documento: '6'
                    numero_documento: '20601234565'
                    nombre: BODEGA SAN MARTÍN & HIJOS E.I.R.L.
                  forma_pago:
                    tipo: CREDITO
                    cuotas:
                    - monto: '123.90'
                      fecha_vencimiento: '2027-01-15'
                    - monto: '123.90'
                      fecha_vencimiento: '2027-02-15'
                  lineas:
                  - codigo_producto: AB-ARR-001
                    descripcion: Arroz extra a granel
                    unidad_medida: KGM
                    cantidad: '50'
                    valor_unitario: '4.20'
              factura_de_vale_legado:
                summary: Factura de vale legado
                value:
                  tipo_comprobante: '01'
                  serie: F001
                  documentos_legado:
                  - VALE-SALIDA-0042
                  cliente:
                    tipo_documento: '6'
                    numero_documento: '20123456786'
                    nombre: DISTRIBUIDORA DE ABARROTES EL SOL S.A.C.
                  lineas:
                  - codigo_producto: AB-AZU-001
                    descripcion: Azúcar rubia (5 sacos de 50 kg despachados con VALE-SALIDA-0042)
                    unidad_medida: KGM
                    cantidad: '250'
                    valor_unitario: '3.80'
              boleta:
                summary: Boleta
                value:
                  tipo_comprobante: '03'
                  serie: B001
                  cliente:
                    tipo_documento: '1'
                    numero_documento: '46027897'
                    nombre: MARÍA QUISPE HUAMÁN
                  lineas:
                  - codigo_producto: AB-ACE-001
                    descripcion: Aceite vegetal botella 1 L
                    unidad_medida: NIU
                    cantidad: '2'
                    valor_unitario: '8.50'
              nota_de_credito:
                summary: Nota de credito
                value:
                  tipo_comprobante: '07'
                  serie: FC01
                  referencia:
                    tipo_comprobante: '01'
                    serie_numero: F001-1
                  motivo: '07'
                  sustento: Devolución de 10 kg de arroz por empaque dañado
                  cliente:
                    tipo_documento: '6'
                    numero_documento: '20123456786'
                    nombre: DISTRIBUIDORA DE ABARROTES EL SOL S.A.C.
                  lineas:
                  - codigo_producto: AB-ARR-001
                    descripcion: Arroz extra a granel (devolución)
                    unidad_medida: KGM
                    cantidad: '10'
                    valor_unitario: '4.20'
              nota_de_debito:
                summary: Nota de debito
                value:
                  tipo_comprobante: 08
                  serie: FD01
                  referencia:
                    tipo_comprobante: '01'
                    serie_numero: F001-1
                  motivo: '01'
                  sustento: Intereses por pago fuera de plazo
                  cliente:
                    tipo_documento: '6'
                    numero_documento: '20123456786'
                    nombre: DISTRIBUIDORA DE ABARROTES EL SOL S.A.C.
                  lineas:
                  - descripcion: Intereses moratorios
                    unidad_medida: ZZ
                    cantidad: '1'
                    valor_unitario: '15.00'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComprobanteSalida'
        '200':
          description: 'Repetición idempotente: se devuelve el comprobante ya emitido, sin crear otro.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComprobanteSalida'
        '202':
          description: Registrado y firmado; OSE no disponible (PENDIENTE_ENVIO).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComprobanteSalida'
        '400':
          description: La solicitud no cumple el esquema del contrato (tipos, formatos, catálogos, campos no permitidos).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '401':
          description: Falta el token Bearer o no es válido.
          content:
