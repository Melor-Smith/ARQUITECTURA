[project]
name = "abc-facturacion-ubl"
version = "2.0.0"
description = "Facturación electrónica UBL 2.1 (SUNAT), inventario permanente y PLE 14.1/12.1 para ABC Software Corp"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{ name = "Melor Smith" }]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.mypy]
python_version = "3.10"
files = ["src", "scripts"]
exclude = ["src/adapters/outbound/ubl/generated/"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# Clases generadas por xsdata desde los XSD oficiales: no se editan a mano.
module = ["src.adapters.outbound.ubl.generated.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["signxml.*", "xsdata.*", "lxml.*", "yaml.*", "xlrd.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src"]
omit = ["src/adapters/outbound/ubl/generated/*", "src/main.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["src/adapters/outbound/ubl/generated", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # tildes y signos del español en textos y comentarios
    "B008",                         # Depends/Query/Body en firmas: patrón idiomático de FastAPI
]

[tool.ruff.lint.isort]
known-first-party = ["src", "tests"]
