name: CI

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Clases UBL al día con los XSD
        run: |
          xsdata generate specs/contracts/ubl-2.1/xsd/maindoc --package src.adapters.outbound.ubl.generated
          git diff --exit-code -- src/adapters/outbound/ubl/generated
      - name: Pruebas (incluye contrato OpenAPI vs código y reglas de arquitectura)
        run: pytest -q
