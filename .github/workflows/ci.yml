name: CI

on:
  push:
  pull_request:

jobs:
  calidad:
    name: Pruebas, tipos y cobertura (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Tipos (mypy)
        run: mypy
      - name: Clases UBL al día con los XSD
        run: |
          xsdata generate specs/contracts/ubl-2.1/xsd/maindoc --package src.adapters.outbound.ubl.generated
          git diff --exit-code -- src/adapters/outbound/ubl/generated
      - name: Pruebas con cobertura mínima del 90 % (contrato, arquitectura, PLE vs Anexo 2)
        run: pytest -q --cov

  seguridad:
    name: Dependencias sin vulnerabilidades conocidas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install pip-audit==2.9.0
      - run: pip-audit -r requirements.txt

  contenedor:
    name: Imagen Docker y prueba de humo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Construir
        run: docker build -t abc-facturacion .
      - name: Levantar y emitir una factura
        run: |
          docker run -d --name api -p 8000:8000 abc-facturacion
          for i in $(seq 1 30); do curl -sf localhost:8000/salud && break; sleep 1; done
          codigo=$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/api/v1/comprobantes \
            -H 'Authorization: Bearer dev-facturador' -H 'Content-Type: application/json' \
            --data @specs/ejemplos/factura.json)
          test "$codigo" = "201"
          test "$(docker exec api whoami)" = "abc"

  diagramas:
    name: Diagramas Mermaid renderizan sin errores
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Renderizar cada docs/diagramas/*.mmd desde cero
        run: |
          echo '{"args": ["--no-sandbox"]}' > /tmp/puppeteer.json
          mkdir -p /tmp/render && cp docs/diagramas/*.mmd /tmp/render/
          for f in /tmp/render/*.mmd; do
            npx -y @mermaid-js/mermaid-cli@11.4.2 -p /tmp/puppeteer.json -i "$f" -o "${f%.mmd}.svg"
          done
          ls -l /tmp/render
